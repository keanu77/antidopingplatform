# Cloudflare Pages 設定（2026-09-19 由 Zeabur Express + MongoDB 遷移）。
#
# 架構改變：171 筆案例與所有教育／TUE 內容改為 build 期編入 bundle 的靜態資料，
# 不再需要 MongoDB；唯一需要寫入的「使用者回饋」改用 D1。
#
# 部署：npm run cf:deploy
#
# Secrets（wrangler pages secret put <NAME> --project-name antidoping-platform）：
#   CRON_SECRET         每日彙整信端點的授權；須與 cron-job.org 任務的 x-cron-secret header 一致
#   ZSEND_API_KEY       ZSend 寄信 API key
#   FEEDBACK_DIGEST_TO  彙整信收件人
#   ZSEND_FROM          （選填）寄件顯示；網域須為 ZSend 已驗證網域
# 新增 D1 欄位後先跑 migration 再部署，否則回饋寫入會因缺欄位而靜默失敗。
name = "antidoping-platform"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/dist"

# 回饋寫入（functions/api/[[path]].js）。未綁定時回饋會被靜默略過而非報錯。
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "antidoping-feedback"
database_id = "7a941144-246f-4316-966a-b76f02fc9bf6"
