name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Lint and syntax
        run: |
          npm --prefix frontend run lint
          node --check scripts/migrate-feedback.mjs
      - name: Tests
        run: |
          npm test
          npm --prefix frontend test
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          npm run test:migrations:local
      - name: Build
        run: npm run cf:build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Asset size budget
        run: |
          npm run check:budget
          npm run check:html

      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Browser journeys and accessibility
        run: npm --prefix frontend run test:browser

      - name: Save browser and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-and-budget
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/dist/build-budget.json
          retention-days: 14
